<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoorLabs</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="doorlabs-shared.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size: 14px; color: #1b1b1b; background: #f6f8fa; }
    header { background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    header .logo { width: 28px; height: 28px; border-radius: 6px; background: #1E6EDC; position: relative; flex: none; }
    header .logo:after { content: ""; position: absolute; left: 7px; right: 7px; top: 12px; height: 4px; background: #fff; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    header small { display: block; font-size: 11px; opacity: .7; font-weight: 400; }
    main { padding: 14px 16px 24px; }
    .demo { background: #fff4ce; border: 1px solid #f0d77a; padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; }
    .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    label.title { display: block; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: #555; margin-bottom: 8px; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .switch input { width: 40px; height: 22px; }
    input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid #c8ccd1; border-radius: 6px; font-size: 14px; font-family: inherit; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid button { padding: 9px 6px; border: 1px solid #c8ccd1; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; display: flex; align-items: center; gap: 6px; justify-content: flex-start; }
    .grid button .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); flex: none; }
    .grid button.active { border-color: #111; box-shadow: 0 0 0 1px #111 inset; font-weight: 600; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(0,0,0,.15); cursor: pointer; }
    .swatches button.active { outline: 3px solid #111; outline-offset: 2px; }
    .hint { font-size: 12px; color: #666; margin-top: 6px; }
    .preview-wrap { display: flex; justify-content: center; padding: 6px 0 2px; }
    .sign { width: 220px; height: 140px; border-radius: 10px; background: #111; padding: 9px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    .screen { width: 100%; height: 100%; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; }
    .screen .st { font-size: 20px; font-weight: 700; line-height: 1.15; }
    .screen .dev { font-size: 11px; opacity: .8; margin-top: 6px; }
    .code { font-family: Consolas, monospace; font-size: 12px; background: #f1f3f5; border-radius: 4px; padding: 6px 8px; word-break: break-word; margin-top: 8px; }
    .actions { display: flex; gap: 8px; }
    .actions button { flex: 1; padding: 10px; border-radius: 6px; font-size: 14px; font-family: inherit; cursor: pointer; border: 1px solid #111; }
    .primary { background: #111; color: #fff; }
    .secondary { background: #fff; color: #111; }
    #msg { min-height: 20px; font-size: 13px; margin-top: 10px; }
    #msg.ok { color: #0B6B2E; }
    #msg.err { color: #b3261e; }
    .off { opacity: .4; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>DoorLabs<small data-i18n="subtitle"></small></h1>
  </header>
  <main>
    <div id="demo" class="demo" style="display:none" data-i18n="demo"></div>

    <div class="card switch">
      <div><strong data-i18n="forSign"></strong><div class="hint" style="margin-top:2px" data-i18n="forSignHint"></div></div>
      <input type="checkbox" id="enabled" checked>
    </div>

    <div id="settings">
      <div class="card">
        <label class="title" for="device" data-i18n="device"></label>
        <input type="text" id="device" list="devices" maxlength="24" data-i18n-placeholder="devicePlaceholder">
        <datalist id="devices"></datalist>
        <div class="hint" data-i18n="deviceHint"></div>
      </div>

      <div class="card">
        <label class="title" data-i18n="status"></label>
        <div class="grid" id="presets"></div>
        <input type="text" id="customText" maxlength="24" data-i18n-placeholder="customPlaceholder" style="display:none;margin-top:8px">
      </div>

      <div class="card">
        <label class="title" data-i18n="color"></label>
        <div class="swatches" id="swatches"></div>
        <div class="hint" data-i18n="colorHint"></div>
      </div>

      <div class="card">
        <label class="title" data-i18n="preview"></label>
        <div class="preview-wrap"><div class="sign"><div class="screen" id="screen"><div class="st" id="pvStatus"></div></div></div></div>
        <div class="hint" data-i18n="writtenAs"></div>
        <div class="code" id="pvCode"></div>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="apply" data-i18n="apply"></button>
      <button class="secondary" id="remove" data-i18n="remove"></button>
    </div>
    <div id="msg"></div>
  </main>

<script>
(function () {
  "use strict";

  // Texte der vier Sprachen (outlook-addin/strings.json, vom Build eingesetzt)
  var STRINGS = {"en":{"subtitle":"Door sign for this appointment","demo":"Preview without Outlook: changes are only simulated here.","forSign":"For the DoorLabs sign","forSignHint":"During this appointment the sign shows the status below.","device":"Device","devicePlaceholder":"e.g. Office Julian (empty = all)","deviceHint":"Name of the device in DoorLabs (not shown on the sign). Empty = all devices.","status":"Status","statusNames":{"meeting":"In a meeting","call":"In a call","free":"Free","back":"Back soon","focus":"Focus","break":"Break","custom":"Custom text"},"customPlaceholder":"Custom text, e.g. Client visit","color":"Colour","colorNames":{"black":"Black","white":"White","yellow":"Yellow","red":"Red","blue":"Blue","green":"Green"},"colorHint":"Only the 6 colours the e-paper (Spectra 6) can show.","preview":"Preview","writtenAs":"Written to the \"Location\" field as:","apply":"Apply","remove":"Remove","busyText":"Busy","saved":"Saved. Location: \"{loc}\". Now save or send the appointment.","disabled":"DoorLabs switched off for this appointment.","removed":"DoorLabs code removed from the appointment.","errRead":"Location could not be read: {error}","errWrite":"Location could not be written: {error}"},"de":{"subtitle":"Türschild für diesen Termin","demo":"Vorschau ohne Outlook: Änderungen werden nur hier simuliert.","forSign":"Fürs DoorLabs-Schild","forSignHint":"Während dieses Termins zeigt das Schild den Status unten.","device":"Gerät","devicePlaceholder":"z. B. Büro Julian (leer = alle)","deviceHint":"Name des Geräts in DoorLabs (steht nicht auf dem Schild). Leer = alle Geräte.","status":"Status","statusNames":{"meeting":"Im Meeting","call":"Im Call","free":"Frei","back":"Bald zurück","focus":"Fokus","break":"Pause","custom":"Eigener Text"},"customPlaceholder":"Eigener Text, z. B. Kundentermin","color":"Farbe","colorNames":{"black":"Schwarz","white":"Weiss","yellow":"Gelb","red":"Rot","blue":"Blau","green":"Grün"},"colorHint":"Nur die 6 Farben, die das E-Paper (Spectra 6) anzeigen kann.","preview":"Vorschau","writtenAs":"Wird so ins Feld «Ort» geschrieben:","apply":"Übernehmen","remove":"Entfernen","busyText":"Besetzt","saved":"Gespeichert. Ort: «{loc}». Termin jetzt speichern oder senden.","disabled":"DoorLabs für diesen Termin ausgeschaltet.","removed":"DoorLabs-Code aus dem Termin entfernt.","errRead":"Ort konnte nicht gelesen werden: {error}","errWrite":"Ort konnte nicht geschrieben werden: {error}"},"it":{"subtitle":"Targa per questo appuntamento","demo":"Anteprima senza Outlook: le modifiche sono solo simulate qui.","forSign":"Per la targa DoorLabs","forSignHint":"Durante questo appuntamento la targa mostra lo stato qui sotto.","device":"Dispositivo","devicePlaceholder":"es. Ufficio Julian (vuoto = tutti)","deviceHint":"Nome del dispositivo in DoorLabs (non appare sulla targa). Vuoto = tutti.","status":"Stato","statusNames":{"meeting":"In riunione","call":"In chiamata","free":"Libero","back":"Torno subito","focus":"Concentrato","break":"In pausa","custom":"Testo personale"},"customPlaceholder":"Testo personale, es. Visita cliente","color":"Colore","colorNames":{"black":"Nero","white":"Bianco","yellow":"Giallo","red":"Rosso","blue":"Blu","green":"Verde"},"colorHint":"Solo i 6 colori che l'e-paper (Spectra 6) può mostrare.","preview":"Anteprima","writtenAs":"Scritto nel campo «Luogo» così:","apply":"Applica","remove":"Rimuovi","busyText":"Occupato","saved":"Salvato. Luogo: «{loc}». Ora salva o invia l'appuntamento.","disabled":"DoorLabs disattivato per questo appuntamento.","removed":"Codice DoorLabs rimosso dall'appuntamento.","errRead":"Impossibile leggere il luogo: {error}","errWrite":"Impossibile scrivere il luogo: {error}"},"fr":{"subtitle":"Plaque de porte pour ce rendez-vous","demo":"Aperçu sans Outlook : les modifications sont seulement simulées ici.","forSign":"Pour la plaque DoorLabs","forSignHint":"Pendant ce rendez-vous, la plaque affiche le statut ci-dessous.","device":"Appareil","devicePlaceholder":"p. ex. Bureau Julian (vide = tous)","deviceHint":"Nom de l'appareil dans DoorLabs (n'apparaît pas sur la plaque). Vide = tous.","status":"Statut","statusNames":{"meeting":"En réunion","call":"En appel","free":"Libre","back":"De retour bientôt","focus":"Concentré","break":"En pause","custom":"Texte libre"},"customPlaceholder":"Texte libre, p. ex. Visite client","color":"Couleur","colorNames":{"black":"Noir","white":"Blanc","yellow":"Jaune","red":"Rouge","blue":"Bleu","green":"Vert"},"colorHint":"Seulement les 6 couleurs que l'e-paper (Spectra 6) peut afficher.","preview":"Aperçu","writtenAs":"Écrit dans le champ « Lieu » ainsi :","apply":"Appliquer","remove":"Retirer","busyText":"Occupé","saved":"Enregistré. Lieu : « {loc} ». Enregistrez ou envoyez maintenant le rendez-vous.","disabled":"DoorLabs désactivé pour ce rendez-vous.","removed":"Code DoorLabs retiré du rendez-vous.","errRead":"Le lieu n'a pas pu être lu : {error}","errWrite":"Le lieu n'a pas pu être écrit : {error}"}};
  // Format, Status, Farben: gemeinsamer Code der App (doorlabs-shared.js, gebaut aus supabase/functions/_shared/doorlabsCode.ts und src/config/spectra6.ts)
  var shared = window.DoorLabsShared;
  var code = shared.code;
  var spectra = shared.spectra;

  var PROP_KEY = "doorlabs";
  var CUSTOM = "custom";

  function pickLang() {
    var l = "";
    try { l = (window.Office && Office.context && Office.context.displayLanguage) || ""; } catch (e) { l = ""; }
    if (!l) l = navigator.language || "en";
    l = l.slice(0, 2).toLowerCase();
    return STRINGS[l] ? l : "en";
  }
  var lang = pickLang();
  var S = STRINGS[lang];
  document.documentElement.lang = lang;

  var state = { enabled: true, device: "", status: "meeting", custom: "", color: "blue" };
  var item = null;         // Outlook-Termin oder Demo-Objekt
  var customProps = null;  // Office.CustomProperties
  var demoLocation = "Room 2";

  function $(id) { return document.getElementById(id); }
  function fmt(text, vars) { return text.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }); }
  function colorInfo(key) {
    for (var i = 0; i < spectra.SPECTRA6.length; i++) if (spectra.SPECTRA6[i].name === key) return spectra.SPECTRA6[i];
    return spectra.SPECTRA6[4];
  }
  function clean(s) { return code.cleanCodeText(s); }
  function buildTag() {
    var isCustom = state.status === CUSTOM;
    return code.formatCode({
      status: isCustom ? null : state.status,
      text: isCustom ? (clean(state.custom) || S.busyText) : "",
      color: state.color,
      device: state.device
    });
  }
  function previewText() { return state.status === CUSTOM ? (clean(state.custom) || S.busyText) : S.statusNames[state.status]; }
  function withTag(loc) { var base = code.stripCode(loc); return (base ? base + " " : "") + buildTag(); }
  function msg(text, cls) { var e = $("msg"); e.textContent = text; e.className = cls || ""; }

  function applyTexts() {
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = S[nodes[i].getAttribute("data-i18n")];
    var ph = document.querySelectorAll("[data-i18n-placeholder]");
    for (var j = 0; j < ph.length; j++) ph[j].placeholder = S[ph[j].getAttribute("data-i18n-placeholder")];
  }

  // ---------- Darstellung ----------
  function renderPresets() {
    var box = $("presets"); box.innerHTML = "";
    var keys = code.STATUS_KEYS.concat([CUSTOM]);
    keys.forEach(function (key) {
      var b = document.createElement("button");
      b.type = "button";
      if (key === state.status) b.className = "active";
      var dot = document.createElement("span"); dot.className = "dot";
      if (key === CUSTOM) { dot.style.background = "transparent"; dot.style.borderStyle = "dashed"; }
      else dot.style.background = colorInfo(code.STATUS_DEFAULT_COLOR[key]).display;
      b.appendChild(dot); b.appendChild(document.createTextNode(S.statusNames[key]));
      b.onclick = function () {
        state.status = key;
        if (key !== CUSTOM) state.color = code.STATUS_DEFAULT_COLOR[key];
        render();
        if (key === CUSTOM) $("customText").focus();
      };
      box.appendChild(b);
    });
    $("customText").style.display = state.status === CUSTOM ? "block" : "none";
  }
  function renderSwatches() {
    var box = $("swatches"); box.innerHTML = "";
    spectra.SPECTRA6.forEach(function (c) {
      var b = document.createElement("button");
      var name = S.colorNames[c.name];
      b.type = "button"; b.title = name; b.setAttribute("aria-label", name);
      b.style.background = c.display;
      if (c.name === state.color) b.className = "active";
      b.onclick = function () { state.color = c.name; render(); };
      box.appendChild(b);
    });
  }
  function renderPreview() {
    var c = colorInfo(state.color);
    var s = $("screen");
    s.style.background = c.display;
    s.style.color = spectra.textColorFor(c.name) === "white" ? "#ffffff" : "#111111";
    s.style.border = c.name === "white" ? "1px solid #ddd" : "none";
    $("pvStatus").textContent = previewText();
    $("pvCode").textContent = buildTag();
  }
  function render() {
    $("enabled").checked = state.enabled;
    $("settings").className = state.enabled ? "" : "off";
    $("device").value = state.device;
    $("customText").value = state.custom;
    renderPresets(); renderSwatches(); renderPreview();
  }

  // ---------- Gerätenamen merken (roamingSettings) ----------
  function loadDevices() {
    var list = [];
    try { if (item && item.__office) list = Office.context.roamingSettings.get("devices") || []; }
    catch (e) { list = []; }
    var dl = $("devices"); dl.innerHTML = "";
    list.forEach(function (n) { var o = document.createElement("option"); o.value = n; dl.appendChild(o); });
    return list;
  }
  function rememberDevice(name) {
    name = clean(name);
    if (!name || !item || !item.__office) return;
    try {
      var rs = Office.context.roamingSettings;
      var list = rs.get("devices") || [];
      if (list.indexOf(name) === -1) { list.unshift(name); list = list.slice(0, 10); rs.set("devices", list); rs.saveAsync(); }
    } catch (e) {}
  }

  // ---------- Termin lesen / schreiben ----------
  function applyParsed(c) {
    if (!c) return;
    state.status = c.status || CUSTOM;
    state.custom = c.status ? "" : c.text;
    state.color = c.color;
    state.device = c.device;
  }
  function applyLoaded(data) {
    if (!data) return;
    if (typeof data.enabled === "boolean") state.enabled = data.enabled;
    // gespeicherte Auswahl (neues und altes Format) über denselben Parser lesen: «Im Meeting | Blau» wird zu meeting | blue
    var c = code.parseCode("[DoorLabs: " + (data.status || "") + " | " + (data.color || "") + " | " + (data.device || "") + "]");
    applyParsed(c);
  }

  function loadFromItem(done) {
    if (!item.__office) {
      applyParsed(code.parseCode(demoLocation));
      return done();
    }
    item.loadCustomPropertiesAsync(function (r) {
      if (r.status === Office.AsyncResultStatus.Succeeded) {
        customProps = r.value;
        var raw = customProps.get(PROP_KEY);
        if (raw) { try { applyLoaded(JSON.parse(raw)); return done(); } catch (e) {} }
      }
      item.location.getAsync(function (lr) {
        if (lr.status === Office.AsyncResultStatus.Succeeded) applyParsed(code.parseCode(lr.value));
        done();
      });
    });
  }

  function getLocation(cb) {
    if (!item.__office) return cb(null, demoLocation);
    item.location.getAsync(function (r) {
      if (r.status === Office.AsyncResultStatus.Succeeded) cb(null, r.value || ""); else cb(r.error);
    });
  }
  function setLocation(value, cb) {
    if (!item.__office) { demoLocation = value; return cb(null); }
    item.location.setAsync(value, function (r) { cb(r.status === Office.AsyncResultStatus.Succeeded ? null : r.error); });
  }
  function saveProps(data, cb) {
    if (!item.__office || !customProps) return cb(null);
    if (data) customProps.set(PROP_KEY, JSON.stringify(data)); else customProps.remove(PROP_KEY);
    customProps.saveAsync(function (r) { cb(r.status === Office.AsyncResultStatus.Succeeded ? null : r.error); });
  }

  function onApply() {
    state.device = $("device").value;
    state.custom = $("customText").value;
    getLocation(function (err, loc) {
      if (err) return msg(fmt(S.errRead, { error: err.message }), "err");
      var newLoc = state.enabled ? withTag(loc) : code.stripCode(loc);
      setLocation(newLoc, function (err2) {
        if (err2) return msg(fmt(S.errWrite, { error: err2.message }), "err");
        var data = { enabled: state.enabled, device: clean(state.device), status: state.status === CUSTOM ? clean(state.custom) : state.status, color: state.color, v: 2 };
        saveProps(data, function () {
          rememberDevice(state.device);
          msg(state.enabled ? fmt(S.saved, { loc: newLoc }) : S.disabled, "ok");
        });
      });
    });
  }
  function onRemove() {
    getLocation(function (err, loc) {
      if (err) return msg(fmt(S.errRead, { error: err.message }), "err");
      setLocation(code.stripCode(loc), function (err2) {
        if (err2) return msg(fmt(S.errWrite, { error: err2.message }), "err");
        saveProps(null, function () {
          state.enabled = false; render();
          msg(S.removed, "ok");
        });
      });
    });
  }

  // ---------- Start ----------
  function wire() {
    $("enabled").onchange = function () { state.enabled = this.checked; render(); };
    $("device").oninput = function () { state.device = this.value; renderPreview(); };
    $("customText").oninput = function () { state.custom = this.value; renderPreview(); };
    $("apply").onclick = onApply;
    $("remove").onclick = onRemove;
  }
  function start(officeItem) {
    item = officeItem || { __office: false };
    applyTexts();
    if (!item.__office) $("demo").style.display = "block";
    wire();
    var devs = loadDevices();
    if (!state.device && devs.length) state.device = devs[0];
    loadFromItem(function () { render(); });
    window.__doorlabs = { state: state, lang: lang, buildTag: buildTag, withTag: withTag, demoLocation: function () { return demoLocation; } };
  }

  function boot() {
    if (typeof Office === "undefined" || !Office.onReady) return start(null);
    Office.onReady(function (info) {
      var it = info && info.host === Office.HostType.Outlook && Office.context.mailbox && Office.context.mailbox.item;
      if (it) { it.__office = true; start(it); } else start(null);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
</body>
</html>
